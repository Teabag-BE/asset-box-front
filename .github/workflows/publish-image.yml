name: CD · build & publish frontend image

on:
  push:
    branches: [main]        # 머지되면 이미지 빌드·푸시(publish)
  pull_request:
    branches: [main]        # PR이면 빌드만(푸시 X) — Dockerfile/빌드 깨짐 검증
  workflow_dispatch:        # 수동 재배포용 (Actions 장애·배포 꼬임 복구)

# 연속 머지 시 CD 가 병렬로 돌면 이전 커밋 빌드가 늦게 끝나 최신 배포를 덮어쓸 수 있다
# (2026-07-20 실제 발생). main CD 는 한 번에 하나만, 새 커밋이 오면 이전 실행은 취소.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 단위 테스트가 실패하면 image(PR 검증·main 이미지)와 deploy 가 모두 건너뛰어진다.
  # image 잡과 분리한 이유: image 는 packages:write 권한이라, 거기서 npm install(서드파티 스크립트)을
  # 돌리면 쓰기 토큰에 노출된다. 테스트 잡은 읽기 권한만 갖는다.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # Dockerfile(node:22-alpine)과 동일
          cache: npm
      - name: 의존성 설치
        run: npm install --no-audit --no-fund
      - name: 단위 테스트
        run: npm test               # TZ=Asia/Seoul 은 vitest.config.js 가 고정

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # GHCR 푸시 권한

    steps:
      - uses: actions/checkout@v4

      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # PR: push=false 라 빌드만 수행(검증) / main push: 빌드 후 GHCR 푸시
      - name: 이미지 빌드 & (머지 시) Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ghcr.io/teabag-be/asset-box-front:latest
            ghcr.io/teabag-be/asset-box-front:${{ github.sha }}

  # main 푸시 시 EC2(self-hosted runner)에서 프론트 컨테이너만 새 이미지로 교체
  deploy:
    if: github.event_name == 'push'
    runs-on: self-hosted
    needs: image
    steps:
      - name: 레지스트리 로그인
        run: echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      - name: 프론트 컨테이너 배포
        run: |
          cd /home/ubuntu
          sudo docker compose --env-file .env.production pull frontend
          sudo docker compose --env-file .env.production up -d --no-build frontend
          sudo docker image prune -f
